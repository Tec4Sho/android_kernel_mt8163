analyze:
  - --disable-all
  - --enable=core.DivideZero
  - --enable=core.CallAndMessage
  - --analyzer-config=clang-tidy:take-config-from-directory=true
  - --no-missing-checker-error
  - --report-hash=diagnostic-message
  - --verbose=info
  - --clean

parse:
  - --trim-path-prefix=$HOME/workspace
  - --print-steps

server:
  - --workspace=$HOME/workspace
  - --port=9090
